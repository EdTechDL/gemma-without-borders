<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gemma Monsters - thumbnail</title>
<style>
  /* Rendered at 3x (1740x840) and downscaled to 580x280, so hairlines and
     small type survive the shrink instead of turning to mush. */
  /* Laid out at 3x then scaled to a 1160x560 window for capture, so the
     WebGL buffer is supersampled rather than upscaled. */
  html,body{margin:0;padding:0;background:#07040b;overflow:hidden}
  #card{position:relative;width:1740px;height:840px;overflow:hidden;
        background:radial-gradient(ellipse 90% 120% at 22% 40%,#241236 0%,#12071c 45%,#07040b 100%);
        font-family:'Trebuchet MS','Segoe UI',sans-serif}
  #scene{position:absolute;inset:0}
  /* warm floor glow under the monsters, and a vignette to hold the edges */
  #glow{position:absolute;left:44%;right:-6%;bottom:-16%;height:62%;
        background:radial-gradient(ellipse at center,rgba(224,141,109,.34),transparent 68%);
        filter:blur(28px);pointer-events:none}
  #vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(ellipse 74% 84% at 40% 46%,transparent 46%,rgba(4,2,8,.62) 84%,#05030a 100%)}
  #copy{position:absolute;left:88px;top:0;bottom:0;width:44%;
        display:flex;flex-direction:column;justify-content:center;z-index:4}
  .kick{font-size:30px;letter-spacing:.42em;text-transform:uppercase;
        color:#e08d6d;font-weight:700;margin-bottom:26px}
  h1{margin:0;font-size:132px;line-height:.94;font-weight:900;letter-spacing:-.012em;
     background:linear-gradient(135deg,#fff6e2 14%,#f0cf92 52%,#d79a63 100%);
     -webkit-background-clip:text;-webkit-text-fill-color:transparent;
     filter:drop-shadow(0 8px 30px rgba(226,192,125,.34))}
  .rule{width:190px;height:7px;margin:34px 0 30px;border-radius:4px;
        background:linear-gradient(90deg,#e08d6d,#ffd87a 70%,transparent)}
  .sub{font-size:35px;line-height:1.34;color:#e7d9ca;font-weight:600;max-width:19ch}
  .sub b{color:#ffd87a;font-weight:800}
  .foot{position:absolute;left:88px;bottom:52px;font-size:24px;letter-spacing:.2em;
        text-transform:uppercase;color:#9d8ba6;font-weight:700;z-index:4}
</style>
</head>
<body>
<div id="card">
  <div id="scene"></div>
  <div id="glow"></div>
  <div id="vig"></div>
  <div id="copy">
    <div class="kick">Grade 9 maths</div>
    <h1>GEMMA<br>MONSTERS</h1>
    <div class="rule"></div>
    <div class="sub">Five monsters. Every one of them wants you to <b>get it wrong</b>.</div>
  </div>
  <div class="foot">Runs entirely on one laptop</div>
</div>

<script src="/static/vendor/three.min.js"></script>
<script src="/static/vendor/GLTFLoader.js"></script>
<script>
(function(){
  var W = 1740, H = 840;
  var host = document.getElementById('scene');
  var r = new THREE.WebGLRenderer({antialias:true, alpha:true});
  r.setPixelRatio(1); r.setSize(W, H);
  r.outputEncoding = THREE.sRGBEncoding;
  host.appendChild(r.domElement);

  var sc = new THREE.Scene();
  var cam = new THREE.PerspectiveCamera(34, W/H, 0.1, 200);
  cam.position.set(0, 0.6, 14);
  cam.lookAt(0, 0.1, 0);

  // Key light warm from the left so the title side reads as the lit side,
  // with a cool rim from behind to lift each silhouette off the background.
  sc.add(new THREE.AmbientLight(0x51406b, 1.25));
  var key = new THREE.DirectionalLight(0xffd9b0, 2.5); key.position.set(-5, 6, 8); sc.add(key);
  var rim = new THREE.DirectionalLight(0x8fd8ff, 1.5); rim.position.set(6, 3, -7); sc.add(rim);
  var warm = new THREE.PointLight(0xe08d6d, 2.2, 26); warm.position.set(3.5, -1.6, 4); sc.add(warm);

  // Embers, sparse and slow: they read as texture at thumbnail size.
  var ep = new THREE.BufferGeometry(), epv = [];
  for (var i = 0; i < 90; i++) epv.push(2 + Math.random()*9, -3 + Math.random()*7, -3 + Math.random()*6);
  ep.setAttribute('position', new THREE.Float32BufferAttribute(epv, 3));
  sc.add(new THREE.Points(ep, new THREE.PointsMaterial({
    color:0xffb277, size:0.075, transparent:true, opacity:0.72, depthWrite:false})));

  // Placed by hand only in position; SIZE is measured, so a wide flier and a
  // squat frog end up reading at the same visual weight.
  // The right half is theirs. Held inside x = +-7.4 so nothing clips the frame
  // at this aspect, and staggered in depth so no two silhouettes merge.
  var CAST = [
    {f:'alien.glb',  x: 1.15, y:-0.60, z: 1.9, s:2.20, ry: 0.42},
    {f:'dragon.glb', x: 3.45, y: 1.05, z:-0.2, s:2.10, ry:-0.30},
    {f:'fish.glb',   x: 5.35, y:-0.85, z: 0.6, s:2.00, ry: 0.34},
    {f:'frog.glb',   x: 7.00, y:-1.10, z: 1.7, s:1.80, ry:-0.26},
    {f:'skull.glb',  x: 5.70, y: 2.75, z:-5.4, s:2.55, ry: 0.10}
  ];
  var loader = new THREE.GLTFLoader(), left = CAST.length;
  CAST.forEach(function(c){
    loader.load('/static/monsters/' + c.f, function(g){
      var o = g.scene;
      var b = new THREE.Box3().setFromObject(o);
      var sz = b.getSize(new THREE.Vector3());
      // the blended metric the game uses: height, or width when a model is
      // mostly wingspan, so nothing normalises to a smear
      var eff = Math.max(sz.y, 0.62*Math.max(sz.x, sz.z), 0.001);
      o.scale.setScalar(c.s / eff);
      var b2 = new THREE.Box3().setFromObject(o);
      var ctr = b2.getCenter(new THREE.Vector3());
      o.position.set(c.x - ctr.x, c.y - ctr.y, c.z - ctr.z);
      o.rotation.y = c.ry;
      if (c.f === 'skull.glb') {           // the Collector, dimmed and behind
        o.traverse(function(m){ if (m.isMesh && m.material) {
          m.material = m.material.clone();
          if (m.material.color) m.material.color.multiplyScalar(0.42);
        }});
      }
      sc.add(o);
      if (--left === 0) { r.render(sc, cam); document.title = 'READY'; }
    }, undefined, function(){ if (--left === 0) { r.render(sc, cam); document.title = 'READY'; } });
  });

  var t = setInterval(function(){ r.render(sc, cam); }, 120);
  setTimeout(function(){ clearInterval(t); r.render(sc, cam); }, 6000);
})();
</script>
</body>
</html>
